[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hybrid-recommendation-engine"
version = "1.0.0"
description = "Production Hybrid Recommendation Engine fusing Collaborative Filtering with SBERT Semantic Embeddings"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [
    {name = "Senior ML Engineering Team", email = "engineering@recsys.local"}
]
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "python-multipart>=0.0.9",
    "httpx>=0.26.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "pandas>=2.1.0",
    "scikit-learn>=1.3.0",
    "sentence-transformers>=2.2.0",
    "scikit-surprise>=1.1.3",
    "implicit>=0.6.0",
    "redis>=5.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.3.0",
    "black>=24.0.0",
    "mypy>=1.8.0",
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --strict-markers -ra"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "C4", "UP"]
ignore = ["B008", "C901"]
